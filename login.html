      <html lang="pt-br">

      <div id="login-div" class="minha-div">
      <body class="body2">

          <div class="esquerda">  
                <img src="1.png" class="logo1">  
            <p class="slogan">Mude o planeta,<br>comece a<br>mudança em casa!</p>
          </div>
          <div class="direita">
            <h2>Login</h2>
            <p class="subtitulo">Preencha com suas informações</p>
            <form action="cadastro.php" method="POST">
              <label for="email">EMAIL</label>
              <input type="email" id="email" required>
      
              <label for="senha">SENHA</label>
              <input type="password" id="senha" required>
      
              <label for="confirmar">CONFIRMAR SENHA</label>
              <input type="password" id="confirmar" required>
      
              <button type="submit">ENTRAR</button>
      
              <div class="google-login">
                <p>Ou entre usando o</p>
                <button type="button" class="google-btn">
                  <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" />
                  Google
                </button>
              </div>
              <p class="register">Ainda não tem conta?</p> 
              <a href="cadastro.html" class="cadastro">Cadastre-se</a>
            </form>
          </div>
        </div>
      </div>
